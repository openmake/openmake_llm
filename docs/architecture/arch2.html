<title>OpenMake LLM — Deployment Architecture</title>
<!--
  OpenMake LLM 배치(머신 단위) 아키텍처 도면의 **소스**.
  구조가 바뀌면 이 HTML 을 고치고 render.mjs 를 다시 돌린다.

    node docs/architecture/render.mjs   → arch2.png (ko) / arch2.en.png (en)

  그림체는 2026-08-23 참고 시안(기기 일러스트 + 아이콘)을 따르되, 텍스트는 소스에서
  가져온다. 시안은 이미지 생성물이라 한국어가 여러 군데 깨져 있었다
  (row SQL / 일·게이트웨이 / 표드 실행 / 얼레이 / 본전). 도면에서 라벨이 틀리면
  그림이 예쁜 것은 의미가 없으므로, 아이콘은 인라인 SVG 로 그리고 글자는 실제 텍스트로 둔다.

  실측 근거: ecosystem.config.js(openmake-llm·openmake-next·openmake-discord),
  scripts/vllm/dgx-ecosystem.config.example.cjs(vllm-chat·vllm-embed·flux),
  infra/docker-compose.yml(postgres·redis), infra/{mcp-runtime,task-runtime,
  egress-proxy,artifact-viewer}, .env(LLM_BASE_URL=127.0.0.1:13401,
  LLM_GATEWAY_PROVIDERS=openrouter,ollama-cloud,nvidia)
-->

<style>
  :root {
    --ink:#0b1220; --sub:#64748b; --line:#e2e8f0;
    --edge:#f59e0b; --pm2:#2563eb; --gw:#0d9488; --data:#0891b2; --box:#e11d48; --dgx:#22c55e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    width:2000px; padding:44px 48px 36px; background:#fff; color:var(--ink);
    font:400 13px/1.5 -apple-system,"SF Pro Text","Pretendard","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg { display:block; flex:none; }
  h1 { text-align:center; font-size:42px; font-weight:800; letter-spacing:-.03em; margin-bottom:6px; }
  .sub-t { text-align:center; font-size:13.5px; color:var(--sub); margin-bottom:22px; }
  .sub-t b { color:#334155; }

  /* ── 공통 패널 ─────────────────────────────── */
  .shell { border:1.5px solid #dbe3ee; border-radius:22px; background:#fbfdff; padding:16px 18px; }
  .rail { display:flex; gap:16px; align-items:stretch; }
  .rail > .badge {
    flex:none; width:132px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; border-radius:16px; text-align:center;
  }
  .badge .t { font-size:15px; font-weight:800; line-height:1.3; }
  .badge .s { font-size:11px; color:var(--sub); }

  .tiles { flex:1; display:grid; gap:0; grid-auto-flow:column; grid-auto-columns:1fr;
           border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; }
  .tile { display:flex; gap:11px; align-items:flex-start; padding:15px 16px; border-left:1px solid #eef2f7; }
  .tile:first-child { border-left:0; }
  .tile b { display:block; font-size:14px; font-weight:750; margin-bottom:3px; }
  .tile p { font-size:11px; line-height:1.55; color:var(--sub); }

  /* ── 진입 경로 ─────────────────────────────── */
  .entries { display:flex; gap:22px; margin:16px 0 14px; }
  .entry { display:flex; align-items:center; gap:12px; padding:13px 18px; border:2px solid var(--edge);
           border-radius:16px; background:#fffbeb; }
  .entry b { font-size:16px; font-weight:800; }
  .entry p { font-size:11.5px; color:#92400e; margin-top:2px; }

  /* ── 본체 3열 ─────────────────────────────── */
  .main { display:grid; grid-template-columns:1090px 128px 1fr; gap:0 16px; align-items:start; }

  /* Mac mini 기기 프레임 */
  .mac { border:2px solid #cbd5e1; border-radius:26px; padding:14px;
         background:linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%); box-shadow:0 2px 0 #cbd5e1 inset; }
  .mac > header { display:flex; align-items:center; gap:12px; padding:2px 8px 12px; }
  .mac > header .t { font-size:22px; font-weight:800; }
  .mac > header .s { font-size:11.5px; color:#475569; }
  .mac > header .chip { margin-left:auto; padding:4px 10px; border-radius:999px; background:#fff;
                        border:1px solid #cbd5e1; font-size:10.5px; color:#475569; font-family:ui-monospace,monospace; }
  .zone { display:flex; gap:14px; align-items:stretch; padding:13px; border-radius:16px; margin-bottom:11px; }
  .zone:last-child { margin-bottom:0; }
  .zone > .zbadge { flex:none; width:96px; display:flex; flex-direction:column; align-items:center;
                    justify-content:center; gap:7px; text-align:center; }
  .zbadge .t { font-size:14px; font-weight:800; line-height:1.35; }
  .zbody { flex:1; display:grid; gap:9px; }
  .row3 { grid-template-columns:repeat(3,1fr); } .row2 { grid-template-columns:1fr 1fr; }
  .item { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line);
          border-radius:12px; background:#fff; }
  .item b { display:block; font-size:13px; font-weight:750; margin-bottom:2px; }
  .item b em { font-style:normal; padding:1px 6px; margin-left:5px; border-radius:5px; background:#f1f5f9;
               font-family:ui-monospace,"SF Mono",monospace; font-size:10.5px; color:#0f172a; font-weight:600; }
  .item p { font-size:10.8px; line-height:1.55; color:var(--sub); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; grid-column:1/-1; }
  .chips i { font-style:normal; padding:5px 11px; border:1px solid #dbeafe; border-radius:999px;
             background:#f8fbff; font-size:10.8px; color:#1e40af; font-weight:600; }
  .hard { grid-column:1/-1; font-size:10.5px; color:var(--sub); padding-top:2px; }

  /* Tailscale 통로 */
  .link { display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:230px; }
  .link .arrow.up { transform:rotate(-90deg); }
  .link .pill { display:flex; flex-direction:column; align-items:center; gap:9px; padding:20px 14px;
                border:2px solid #86efac; border-radius:22px; background:#f0fdf4; }
  .link .pill .t { font-size:14px; font-weight:800; text-align:center; line-height:1.4; }
  .link .pill .s { font-size:10.5px; color:#15803d; text-align:center; line-height:1.4; }
  .link .arrow { color:#22c55e; font-size:22px; }

  /* DGX 섀시 */
  .dgx { border:2px solid #0f172a; border-radius:22px; background:linear-gradient(180deg,#111827,#0b1220);
         padding:16px; position:relative; overflow:hidden; }
  .dgx::after { content:""; position:absolute; right:10px; top:56px; bottom:16px; width:52px; border-radius:10px;
                background:repeating-linear-gradient(135deg,#1f2937 0 6px,#0b1220 6px 12px); opacity:.9; }
  .dgx > header { display:flex; align-items:center; gap:10px; margin-bottom:13px; }
  .dgx > header .t { font-size:19px; font-weight:800; color:#fff; }
  .dgx > header .s { font-size:11.5px; color:#94a3b8; }
  .dgx .item { background:#0f1a2e; border-color:#1f2a3d; margin-right:62px; }
  .dgx .item b { color:#fff; } .dgx .item p { color:#94a3b8; }
  .dgx .item b em { background:#1f2a3d; color:#bbf7d0; }
  .dgx .note { margin:12px 62px 0 0; display:flex; gap:9px; align-items:flex-start; padding:10px 12px;
               border:1px solid #1f2a3d; border-radius:12px; background:#0f1a2e; font-size:10.5px;
               line-height:1.55; color:#94a3b8; }

  /* 외부 provider 구름 */
  .cloud { margin-top:14px; border:2px dashed #cbd5e1; border-radius:26px; background:#f8fafc; padding:14px 16px; }
  .cloud > header { display:flex; align-items:center; gap:9px; margin-bottom:11px; }
  .cloud > header .t { font-size:15px; font-weight:800; }
  .cloud > header .s { font-size:11px; color:var(--sub); }
  .cloud .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .cloud .out { margin-top:9px; text-align:right; font-size:10.5px; color:var(--sub); }

  /* 하단 */
  .legend { display:flex; align-items:center; justify-content:center; gap:26px; margin-top:20px; font-size:12px; color:#475569; }
  .legend u { text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
  .legend u s { text-decoration:none; width:11px; height:11px; border-radius:50%; }
  .flowbar { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px; padding:14px 22px;
             border:1.5px solid var(--line); border-radius:999px; background:#fbfdff; font-size:19px; font-weight:800; }
  .flowbar span.a { color:#cbd5e1; font-size:17px; }
  .flowbar .c1 { color:#f59e0b; } .flowbar .c2 { color:#1e3a8a; } .flowbar .c3 { color:#0d9488; } .flowbar .c4 { color:#16a34a; }
  .stamp { position:absolute; top:44px; right:48px; text-align:right; font-size:11px; line-height:1.6; color:var(--sub); }
  .stamp b { color:var(--ink); }
</style>
