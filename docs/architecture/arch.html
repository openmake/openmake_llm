<style>

  .wfbox > p { margin-top: 8px; font-size: 10.5px; line-height: 1.55; color: var(--sub); }

    [{ ko: '파일 스토리지', en: 'File storage' }, { ko: 'data/uploads(task 첨부 원본) · public/generated(생성 이미지) · artifact-viewer/data', en: 'data/uploads (task attachments) · public/generated (images) · artifact-viewer/data' }],
  ],
  llm: [
    [{ ko: 'LiteLLM 통합 게이트웨이', en: 'LiteLLM unified gateway' }, { ko: 'Mac <code>127.0.0.1:13401</code> · PM2 · master key 인증 · BYOK 는 x-api-key 헤더', en: 'Mac <code>127.0.0.1:13401</code> · PM2 · master-key auth · BYOK via the x-api-key header' }],
    [{ ko: 'DGX vLLM (Tailscale 사설망)', en: 'DGX vLLM (Tailscale private network)' }, { ko: '<code>:8002</code> qwen3.6-35b-a3b chat(262K) · <code>:8003</code> bge 임베딩 · <code>:8005</code> FLUX 이미지', en: '<code>:8002</code> qwen3.6-35b-a3b chat (262K) · <code>:8003</code> bge embeddings · <code>:8005</code> FLUX images' }],
    [{ ko: '외부 provider — 게이트웨이 경유', en: 'External providers — through the gateway' }, { ko: 'openrouter · ollama-cloud · NVIDIA NIM (wildcard + BYOK)', en: 'openrouter · ollama-cloud · NVIDIA NIM (wildcard + BYOK)' }],
    [{ ko: 'Direct 예외', en: 'Direct exceptions' }, { ko: 'ollama-local(사용자별 endpoint) · ChatGPT OAuth (격리 불가 → 영구 direct)', en: 'ollama-local (per-user endpoint) · ChatGPT OAuth (cannot be proxied → always direct)' }],
  ],
};

const L = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ko';
const t = T[L];
const p = (v) => (typeof v === 'string' ? v : v[L]);
const esc = (s) => s;

function card(title, desc, color) {
  return `<div class="card" style="--c:${color}"><h3>${p(title)}</h3><p>${p(desc)}</p></div>`;
}
function layer(color, name, tag, meta, inner) {
  return `<section class="layer"><h2><span class="dot" style="background:${color}"></span>${name}
    ${tag ? `<span class="tag">${tag}</span>` : ''}${meta ? `<span class="meta">${meta}</span>` : ''}</h2>${inner}</section>`;
}
const flow = (s) => `<div class="flow"><span>▼&nbsp;&nbsp;${s}&nbsp;&nbsp;▼</span></div>`;

const stampDate = document.currentScript ? '' : '';
let html = `
<div class="head">
  <div>
    <h1><b>OpenMake LLM</b> ${t.title[0].replace('OpenMake LLM — ', '— ')} <small>${t.title[1]}</small></h1>
    <p>${t.lede}</p>
  </div>
  <div class="stamp"><b>${window.__STAMP__ || '2026-08-23'}</b> ${t.stamp[0]}<br>${t.stamp[1]}<br>${t.stamp[2]}</div>
</div>`;

html += layer('var(--client)', t.clients, 'apps/*', '',
  `<div class="grid g5">${D.clients.map(([n, d]) => card(n, d, 'var(--client)')).join('')}</div>`);

html += `<div style="height:12px"></div>`;
html += layer('var(--pkg)', t.packages, 'packages/*', '',
  `<div class="grid g3">${D.packages.map(([n, d]) => card(n, d, 'var(--pkg)')).join('')}</div>`);

html += flow(t.f1);
html += layer('var(--edge)', t.edge, '', '',
  `<div class="grid g3">${D.edge.map(([n, d]) => card(n, d, 'var(--edge)')).join('')}</div>`);

html += flow(t.f2);

let api = `<p style="font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:9px">${t.entry}</p>
  <div class="grid g5">${D.entry.map(([n, d]) => card(n, d, 'var(--api)')).join('')}</div>`;

api += flow(t.f3);
api += `<div class="pipe"><h4><em>①</em>${t.pipeTitle}<span>${t.pipeSub}</span></h4>
  <div class="steps">${D.steps.map((s, i) =>
    `<div class="step"><b><span class="n">${i + 1}</span>${L === 'ko' ? s[0] : s[1]}</b><i>${L === 'ko' ? s[2] : s[3]}</i></div>`).join('')}</div></div>`;

api += `<div class="wf">${D.wf.map(([c, n, name, src, items, note]) => `
  <div class="wfbox" style="border-color:${c}33">
    <h4><span class="n" style="background:${c}">${n}</span>${name}<span class="src">${src}</span></h4>
    <ul>${items.map((it) => `<li><b>${L === 'ko' ? it[0] : it[1]}</b><i>${it.length > 3 ? (L === 'ko' ? it[2] : it[3]) : it[2]}</i></li>`).join('')}</ul>
    ${note ? `<p>${p(note)}</p>` : ''}
  </div>`).join('')}</div>`;

api += flow(t.f4);
api += `<div class="card" style="--c:var(--llm);background:#fffbf5">
  <h3>${t.core} — <code>providers/provider-router</code> + <code>llm/LLMClient</code></h3>
  <p>${L === 'ko'
    ? 'SdkType = local-llm · anthropic · openai-compatible · chatgpt-oauth · LLMClient 는 per-request 생성 · cluster/ 가 노드 health check · circuit breaker 로 라우팅 · per-user 토큰 쿼터(KVStore, fail-open)'
    : 'SdkType = local-llm · anthropic · openai-compatible · chatgpt-oauth · LLMClient is created per request · cluster/ health-checks nodes · circuit breaker routing · per-user token quota (KVStore, fail-open)'}</p></div>`;

api += `<div class="band"><b>${t.cross}</b>${D.cross.map(([n, d]) => `<i><b>${p(n)}</b> — ${p(d)}</i>`).join('')}</div>`;
api += `<div class="band"><b>⑥ ${t.boot}</b>${D.boot[L].map((s) => `<i>${s}</i>`).join('<span style="align-self:center;color:#cbd5e1">›</span>')}</div>`;

html += layer('var(--api)', `${t.api} — apps/api`, 'Express 5 · TypeScript · PM2 · :52416', '', api);

html += `<div class="cols" style="margin-top:12px">
  ${layer('var(--data)', t.dataTitle, '', t.f5, `<div class="grid g3">${D.data.map(([n, d]) => card(n, d, 'var(--data)')).join('')}</div>`)}
  ${layer('var(--llm)', t.llmTitle, '', t.f6, `<div class="grid g2">${D.llm.map(([n, d]) => card(n, d, 'var(--llm)')).join('')}</div>`)}
</div>`;

const legendItems = [['var(--client)', t.clients], ['var(--pkg)', t.packages], ['var(--edge)', t.edge],
  ['var(--api)', t.api], ['var(--sandbox)', 'Docker'], ['var(--data)', t.dataTitle], ['var(--llm)', t.llmTitle]];
html += `<div class="legend"><b>${t.legend[0]}</b>${legendItems.map(([c, n]) =>
  `<u><s style="background:${c}"></s>${n}</u>`).join('')}
  <span style="margin-left:auto">◈ = ${t.legend[2]} · 🐳 = ${t.legend[3]}</span></div>`;

document.body.innerHTML = html;
</script>
