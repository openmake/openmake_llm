<style>
  :root {
    --ink:#0b1220; --sub:#64748b; --line:#e2e8f0;

    --gw:#f97316; --data:#0891b2; --box:#e11d48;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    width:2000px; padding:44px 48px 36px; background:#fff; color:var(--ink);

  .sub-t b { color:#334155; }
  .stamp { position:absolute; top:44px; right:48px; text-align:right; font-size:11px; line-height:1.6; color:var(--sub); }
  .stamp b { color:var(--ink); }

  .shell { border:1.5px solid #dbe3ee; border-radius:22px; background:#fbfdff; padding:15px 17px; }
  .rail { display:flex; gap:16px; align-items:stretch; }
  .rail > .badge { flex:none; width:126px; display:flex; flex-direction:column; align-items:center;
                   justify-content:center; gap:8px; text-align:center; }
  .badge .t { font-size:14.5px; font-weight:800; line-height:1.3; }
  .badge .s { font-size:10.5px; color:var(--sub); font-family:ui-monospace,monospace; }
  .tiles { flex:1; display:grid; gap:0; grid-auto-flow:column; grid-auto-columns:1fr;
           border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; }
  .tile { display:flex; gap:11px; align-items:flex-start; padding:14px 15px; border-left:1px solid #eef2f7; }
  .tile:first-child { border-left:0; }
  .tile b { display:block; font-size:13.5px; font-weight:750; margin-bottom:3px; }
  .tile p { font-size:10.8px; line-height:1.55; color:var(--sub); }

  .gap { display:flex; justify-content:center; align-items:center; gap:10px; margin:11px 0; }
  .gap span { padding:6px 18px; border:1px solid var(--line); border-radius:999px; background:#fff;
              font-size:11.5px; font-weight:650; color:#475569; }
  .gap i { font-style:normal; color:#cbd5e1; font-size:15px; }

  /* 앱 서버 프레임 */
  .api { border:2px solid #a7f3d0; border-radius:26px; padding:14px; background:linear-gradient(180deg,#f0fdf9,#ecfdf5); }
  .api > header { display:flex; align-items:center; gap:12px; padding:2px 8px 12px; }
  .api > header .t { font-size:22px; font-weight:800; }
  .api > header .s { font-size:11.5px; color:#047857; }
  .api > header .chip { margin-left:auto; padding:4px 11px; border-radius:999px; background:#fff;
                        border:1px solid #a7f3d0; font-size:10.5px; color:#047857; font-family:ui-monospace,monospace; }
  .zone { display:flex; gap:14px; align-items:stretch; padding:13px; border-radius:16px; margin-bottom:11px; background:#fff; }
  .zone:last-child { margin-bottom:0; }
  .zone > .zbadge { flex:none; width:100px; display:flex; flex-direction:column; align-items:center;
                    justify-content:center; gap:7px; text-align:center; }
  .zbadge .t { font-size:13.5px; font-weight:800; line-height:1.35; }
  .zbody { flex:1; display:grid; gap:9px; }
  .r5 { grid-template-columns:repeat(5,1fr); } .r4 { grid-template-columns:repeat(4,1fr); }
  .r3 { grid-template-columns:repeat(3,1fr); } .r2 { grid-template-columns:1fr 1fr; }
  .item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line);
          border-radius:12px; background:#fff; }
  .item b { display:block; font-size:12.5px; font-weight:750; margin-bottom:2px; }
  .item b em { font-style:normal; padding:1px 6px; margin-left:5px; border-radius:5px; background:#f1f5f9;

  .item p { font-size:10.6px; line-height:1.55; color:var(--sub); }

  /* 채팅 파이프라인 */
  .pipe { border:1.5px solid #bfdbfe; border-radius:16px; background:#f8fbff; padding:13px; margin-bottom:11px; }
  .pipe > h4 { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; margin-bottom:10px; }
  .pipe > h4 em { font-style:normal; padding:3px 10px; border-radius:999px; background:#2563eb; color:#fff; font-size:11px; }
  .pipe > h4 span { font-weight:500; font-size:11px; color:var(--sub); font-family:ui-monospace,monospace; }
  .steps { display:flex; align-items:stretch; gap:5px; }
  .step { flex:1; border:1px solid #dbeafe; border-radius:11px; background:#fff; padding:9px 10px; }
  .step .n { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;

  .step b { font-size:11.8px; font-weight:750; }
  .step p { margin-top:4px; font-size:10.2px; line-height:1.5; color:var(--sub); }
  .steps > i { font-style:normal; align-self:center; color:#93c5fd; font-size:14px; flex:none; }

  /* 워크플로우 레인 */
  .lanes { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-bottom:11px; }
  .lane { border:1.5px solid var(--lc); border-radius:16px; background:#fff; overflow:hidden; }
  .lane > h5 { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--lb); }
  .lane > h5 .n { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;

  .lane > h5 b { font-size:13.5px; font-weight:800; }
  .lane > h5 span { margin-left:auto; font-size:10px; color:var(--sub); font-family:ui-monospace,monospace; }
  .lane ol { list-style:none; padding:10px 12px; }
  .lane li { padding:7px 0; border-top:1px dashed var(--line); }
  .lane li:first-child { border-top:0; padding-top:2px; }
  .lane li b { display:block; font-size:11.8px; font-weight:700; margin-bottom:2px; }
  .lane li p { font-size:10.3px; line-height:1.5; color:var(--sub); }
  .lane > p.foot { padding:9px 12px 11px; font-size:10.2px; line-height:1.5; color:var(--sub); border-top:1px solid var(--line); }

  .core { display:flex; gap:12px; align-items:center; padding:13px 15px; border:1.5px solid #fdba74;
          border-radius:16px; background:#fff7ed; margin-bottom:11px; }
  .core b { font-size:14px; font-weight:800; }
  .core code { padding:1px 6px; border-radius:5px; background:#ffedd5; font-family:ui-monospace,monospace; font-size:11px; }
  .core p { margin-top:3px; font-size:10.8px; line-height:1.55; color:#9a3412; }

  .band { display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:11px 13px; border:1px solid var(--line);
          border-radius:14px; background:#fff; margin-bottom:11px; }
  .band > b { font-size:12px; font-weight:800; margin-right:4px; }
  .band i { font-style:normal; padding:5px 10px; border:1px solid var(--line); border-radius:8px;
            background:#fbfdff; font-size:10.5px; color:#334155; }
  .band i b { font-weight:700; }
  .band .sep { color:#cbd5e1; }

  .bottom { display:grid; grid-template-columns:1fr 1.3fr; gap:14px; margin-top:12px; }
  .legend { display:flex; align-items:center; justify-content:center; gap:24px; margin-top:18px; font-size:12px; color:#475569; }
  .legend u { text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
  .legend u s { text-decoration:none; width:11px; height:11px; border-radius:50%; }
</style>
