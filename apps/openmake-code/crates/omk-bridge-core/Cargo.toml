[package]
name = "omk-bridge-core"
description = "OpenMake 로컬 브리지 보안 코어 — 판정 함수와 파일 kind 처리(TS local-bridge-core 이식)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regress = "0.12.0"
serde_json = "1.0.154"
# 파일 kind 의 시간 제한·동시 작업 상한만 쓴다 — net·process·macros 는 넣지 않는다(설계 D-12).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync"] }

[lints]
workspace = true
