[package]
name = "omk-ffi"
description = "OpenMake Code 앱(Swift)이 같은 프로세스 안에서 브리지 호스트를 돌리는 UniFFI 정적 라이브러리(PR-3.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib 은 앱(XCFramework), lib(rlib)은 Rust 시험용.
crate-type = ["staticlib", "lib"]

[dependencies]
omk-bridge-host = { path = "../omk-bridge-host" }
omk-bridge-conn = { path = "../omk-bridge-conn" }
omk-bridge-core = { path = "../omk-bridge-core" }
# 판 고정 — omk-ffi-bindgen 과 같은 글자(PR-3.2 D-230·T0 U-1). MPL-2.0(D-231·D-244, THIRD_PARTY_NOTICES.md).
uniffi = "=0.32.2"
# cloexec.rs 의 fcntl·getdtablesize(PR-3.2 D-241(r3) ①) — 이미 Cargo.lock 에 있는 판.
libc = "0.2"

[dev-dependencies]
# T-F7 — 호스트 런타임에 패닉하는 태스크를 넣는다.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }

# unsafe 예외는 이 크레이트 하나(PR-3.2 D-224) — 워크스페이스의 forbid 는 하위 allow 로 못 풀므로 lints 표를 통째로 쓴다.
# 허용 자리는 lib.rs 의 #![allow(unsafe_code)](UniFFI 생성 코드)와 cloexec.rs 뿐이고 tests/ffi_guard.rs 가 고정한다.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
