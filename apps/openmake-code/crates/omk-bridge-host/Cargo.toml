[package]
name = "omk-bridge-host"
description = "브리지 호스트 — 주 actor·루트 표·확인 대기·종료 순서·잠금·호스트 값. omk-helper(stdio)와 omk-ffi(Swift)가 같이 쓴다(PR-3.2 D-223)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
omk-bridge-core = { path = "../omk-bridge-core" }
omk-bridge-conn = { path = "../omk-bridge-conn" }
serde_json = "1.0.154"
# 런타임은 연결 크레이트의 host_runtime() 하나. 신호(`signal`)는 넣지 않는다 — 처리기는 어댑터(헬퍼)만 단다(PR-3.2 D-228).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "process", "macros"] }

[dev-dependencies]
# 가짜 브리지 서버(tests/support) — 연결 크레이트와 같은 버전·기능.
tokio = { version = "1.54.1", default-features = false, features = ["net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true
