<!-- OpenMake 브랜드 마크 (톱니 + 열쇠구멍). public/logo.png 의 기하 실측값을 벡터로 재드로잉한 것으로,
     원본 래스터에 합성돼 있던 "OpenMake LLM" 글자가 없다 — 탭/앱 아이콘 크기에서 글자는 뭉개지기만 한다.
     톱니 8개·45° 주기·12시 정렬, 링 외경/내경과 열쇠구멍 비율 모두 원본 실측 기준.
     마크는 캔버스의 98% — 탭에서 16px 로 줄면 여백이 그대로 손해라 여백을 최소화했다.
     UI 로고 public/logo.svg 와 동일한 마크이므로 한쪽을 고치면 다른 쪽도 함께 갱신할 것. -->
