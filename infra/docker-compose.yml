# OpenMake LLM — 인프라 의존성(DB/Redis) Docker 분리 운영
#
# 목적: 호스트 brew(postgresql@16, redis) 대신 버전 고정·격리·이식 가능한 컨테이너로 운영.
# 애플리케이션(apps/api, apps/web)은 여전히 PM2 + 직접 배포 (이 compose 에 포함하지 않음).
#
# 사용 (레포 루트에서):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d       # DB+Redis 기동
#   docker compose --env-file .env -f infra/docker-compose.yml ps          # 상태
#   docker compose --env-file .env -f infra/docker-compose.yml logs -f postgres
#   docker compose --env-file .env -f infra/docker-compose.yml down        # 정지 (볼륨 유지)
#   docker compose --env-file .env -f infra/docker-compose.yml down -v     # 정지 + 볼륨 삭제(주의)
#
# ⚠ --env-file 은 선택이 아니다: compose 는 기본 .env 를 "compose 파일이 있는 디렉터리"
#   (= infra/) 기준으로 찾는다. 루트 .env 를 명시하지 않으면 POSTGRES_PASSWORD 가 비어
#   `:?` 검증에 걸려 기동이 실패한다. (install.sh / openmake_llm.sh 는 자동으로 붙인다.)
#
# 선행: .env 에 POSTGRES_PASSWORD 를 DATABASE_URL 의 비밀번호와 동일하게 설정.
#   (DATABASE_URL=postgresql://openmake:<PW>@127.0.0.1:5432/openmake_llm ↔ POSTGRES_PASSWORD=<PW>)
#
# 인스턴스 병행 (install.sh --instance NAME):
#   .env 의 OMK_INSTANCE=NAME 이 컨테이너·볼륨 이름에 "-NAME" 을 붙인다
#   (openmake-NAME-postgres / openmake-NAME_pgdata). 미설정(기본 인스턴스)이면 기존 이름
#   openmake-postgres / openmake_pgdata 그대로 — 기존 설치본은 아무것도 바뀌지 않는다.
#   COMPOSE_PROJECT_NAME=openmake-NAME 도 .env 에 함께 둔다 — 두 설치본이 같은 프로젝트 이름
#   (디렉터리명 infra)으로 잡히면 compose 가 상대 컨테이너를 자기 것으로 보고 재생성해 버린다.
#   (컨테이너 이름에 COMPOSE_PROJECT_NAME 을 쓰지 않는 이유: compose 가 해석된 프로젝트 이름을
#    보간 변수로도 노출해 기본 설치본이 infra-postgres 로 바뀐다.)
#
# 초기화: 빈 볼륨 첫 기동 시 db/init/*.sql(001→002→003) 자동 실행.
#   단 db/migrations/ 는 자동 적용 안 됨 → 기동 후:
#     npx ts-node apps/api/src/data/migrations/cli.ts migrate

services:
  postgres:
    image: postgres:16
    container_name: openmake${OMK_INSTANCE:+-${OMK_INSTANCE}}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요 (DATABASE_URL 비번과 동일)}
      POSTGRES_DB: ${POSTGRES_DB:-openmake_llm}
      # 초기 관리자 계정 (004-admin-user.sh). 미설정 시 계정을 만들지 않는다.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-support@openmake.cc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openmake_pgdata:/var/lib/postgresql/data
      # init 스크립트 (첫 기동·빈 볼륨에서만 실행). read-only 마운트.
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmake} -d ${POSTGRES_DB:-openmake_llm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: openmake${OMK_INSTANCE:+-${OMK_INSTANCE}}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - openmake_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openmake_pgdata:
    name: openmake${OMK_INSTANCE:+-${OMK_INSTANCE}}_pgdata
  openmake_redisdata:
    name: openmake${OMK_INSTANCE:+-${OMK_INSTANCE}}_redisdata
