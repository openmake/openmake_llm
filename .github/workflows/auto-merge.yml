# Privileged orchestration executes only trusted default-branch code.
name: auto-merge
# 예약 실행은 Dependabot PR 을 병합한다 — Dependabot 이 일으킨 CI 의 workflow_run 에는 저장소 비밀값이 오지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')) && 'pipeline-auto-merge' || format('pipeline-auto-merge-skip-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  orchestrate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Verify credentials and run trusted orchestration
        env:
          OMK_AUTOMATION_TOKEN: ${{ secrets.OMK_AUTOMATION_TOKEN }}
          OMK_PROMOTE_TOKEN: ${{ secrets.OMK_PROMOTE_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_run' && 'feature' || 'dependabot' }}
        run: node scripts/pipeline/github.mjs "$MODE"
