# ==============================================================
# GitHub Actions CI Pipeline
# ==============================================================
# 게이트(실제 순서): Contract Drift → Installer Lint → Dependency Audit → Jest → DB Tests(1.5) → TypeScript Build → File Size Guard
#   → ESLint → Add-on Boundary(ratchet) → ESLint·i18n(apps/web) → Routing Eval → Response Eval → 7~12 mock 평가
# 로컬 `npm test`/`npm run build`/`npm run lint` 와 같은 스크립트로 돈다(별도 미러 스크립트 없음).
# Docker 빌드·이미지 사용 없음(프로젝트 방침) — 예외: Gate 1.5 DB 테스트용 PostgreSQL 서비스 컨테이너(설계 D3, 이 job 안에서만 사는 빈 DB)
# 대상 브랜치: main(staging·릴리스가 따른다)과 dev(feature/* 가 모인다). dev 에 합칠 때도 같은 게이트를 지난다 —
# 검사가 dev → main PR 에 몰리면 실패한 커밋을 찾기 어렵다.
# ==============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-secret-for-testing-only
  # 암호화 경로 테스트용 더미 키(hex 32B). 미설정이면 token-crypto 가 test 환경에서 no-op 이
  # 되어 "secret 을 암호화한다" 류 테스트가 실패한다. **운영 키와 무관한 고정 더미값**이다.
  TOKEN_ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'

jobs:
  ci:
    name: CI Gate (Test → Build → Size → Lint)
    runs-on: ubuntu-latest
    # 15 → 25 (2026-08-01): 게이트 6종 총 소요가 13~15분으로 상한에 붙어,
    # 모든 게이트가 success 인데도 15분 02초에 job 이 cancelled 된 사례가 있었다(#421 1차).
    # 실제 실행 시간 단축(Jest 병렬화·게이트 분리)은 별도 과제.
    # 25 → 35 (2026-09-02): 총 소요가 21~24분(Jest 단독 ~19분)으로 다시 상한에 붙어
    # 게이트 16단계 전부 success 인데 25분 00초에 cancelled 된 사례 재발(#711 1차).
    # 35 → 50 (2026-09-17): Jest 단독 ~33분(4,000건 대)으로 마지막 게이트(Response Pattern mock)가
    # 35분 02초에 cancelled 됐다(#912 1차 — 그 앞 게이트 전부 success). Jest 병렬화는 여전히 별도 과제.
    timeout-minutes: 50

    # Source CI executes repository code with a read-only token.
    permissions:
      contents: read

    # DB 통합 테스트(*.db.test.ts)용 일회용 PostgreSQL(pgvector — knowledge add-on 마이그레이션이 vector 확장을 만든다).
    # Gate 1.5 만 TEST_DATABASE_URL 로 쓴다. 포트 5433 — model-assignments DB 테스트는 :5432 URL 이면 스스로 skip 한다.
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg16-trixie
        env:
          POSTGRES_USER: openmake
          POSTGRES_PASSWORD: openmake_test
          POSTGRES_DB: openmake_llm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openmake -d openmake_llm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 모노레포 npm workspaces — 루트 npm ci 한 번이면 모든 workspace 설치 + hoisting.
      # (apps/api 에서 중복 npm ci 하면 hoisting 이 깨져 web-scraper 의 playwright-core
      #  dynamic import 가 tsc 에서 TS2307 로 실패함 — 루트 설치만 유지)
      - name: Install dependencies
        run: npm ci

      # ─── Gate 0: API Contract Drift ───
      # packages/api-contracts 산출물이 TS SoT(swagger/spec-core·shared-types)와 일치하는지 검사.
      # 스펙 변경 후 `npm run contracts:export` 재생성을 누락한 커밋을 차단한다 (iOS 축 1 Step 5).
      # git diff 가 아니라 porcelain 인 이유: 신규 산출물 파일(미추적)도 drift 로 잡아야 함.
      # 수 초짜리 검사라 무거운 게이트들보다 앞에 둔다 (fail-fast, 기존 게이트 번호 유지 위해 Gate 0).
      - name: "Gate 0: API Contract Drift"
        run: |
          npm run contracts:export
          DRIFT=$(git status --porcelain -- packages/api-contracts)
          if [ -n "$DRIFT" ]; then
            echo "::error::계약 산출물 drift 감지 — 스펙(TS SoT) 변경 후 'npm run contracts:export' 를 실행해 산출물을 함께 커밋하세요"
            echo "$DRIFT"
            git diff -- packages/api-contracts | head -100
            exit 1
          fi
          echo "계약 산출물 최신 상태 확인"

      # ─── Gate 0.5: Installer Lint ───
      # install.sh(47KB)·openmake_llm.sh 는 레포 파일 구조를 참조하는 배포 진입점인데
      # 어떤 게이트도 검사하지 않아, 리팩터링이 인스톨러를 조용히 깨뜨려도 신규 설치자가
      # 실패할 때까지 발견되지 않았다 (4축 배포 제품화 대조, 2026-08-22). bash -n(문법) +
      # shellcheck warning 이상 0건을 강제한다 — 도입 시점 클린 실측(지적 4건 전부 수정).
      # 전체 설치 완주는 별도 주간 워크플로우(install-smoke.yml — 러너 15분급이라 per-PR 과대).
      # 환경 매니저 omk(scripts/env) 도 같은 배포 진입점이라 같은 기준으로 본다 — 순수 함수 테스트는 수 초.
      - name: "Gate 0.5: Installer Lint"
        run: |
          bash -n install.sh
          bash -n install_mac.sh
          bash -n install_linux.sh
          for f in scripts/setup/common/*.sh scripts/setup/mac/*.sh scripts/setup/linux/*.sh; do bash -n "$f"; done
          bash -n openmake_llm.sh
          for f in scripts/env/*.sh; do bash -n "$f"; done
          bash -n scripts/setup/mac-toolchain.test.sh
          bash -n scripts/setup/mac-host-repair.sh
          bash -n scripts/setup/mac-host-repair.test.sh
          bash -n scripts/setup/mac-pm2-boot.sh
          bash -n scripts/setup/pm2-boot-guard.sh
          node --check scripts/setup/colima-boot-guard.cjs
          bash -n scripts/setup/colima-boot-guard.test.sh
          bash -n scripts/setup/mac-pm2-boot.test.sh
          bash -n uninstall.sh
          bash -n scripts/setup/uninstall.test.sh
          bash -n scripts/setup/linux-web-port.test.sh
          for f in scripts/backups/*.sh scripts/airgap/*.sh; do bash -n "$f"; done
          shellcheck -S warning install.sh install_mac.sh install_linux.sh \
            scripts/setup/common/*.sh scripts/setup/mac/*.sh scripts/setup/linux/*.sh \
            openmake_llm.sh scripts/env/*.sh \
            scripts/setup/mac-toolchain.test.sh scripts/setup/uninstall.test.sh scripts/setup/linux-web-port.test.sh \
            scripts/setup/mac-host-repair.sh scripts/setup/mac-host-repair.test.sh scripts/setup/fake-launchctl.test-lib.sh \
            scripts/setup/mac-pm2-boot.sh scripts/setup/pm2-boot-guard.sh scripts/setup/mac-pm2-boot.test.sh \
            scripts/setup/colima-boot-guard.test.sh \
            scripts/backups/*.sh scripts/airgap/*.sh
          for f in scripts/env/*.test.sh; do bash "$f"; done
          bash scripts/setup/mac-toolchain.test.sh
          bash scripts/setup/mac-host-repair.test.sh
          bash scripts/setup/mac-pm2-boot.test.sh
          bash scripts/setup/colima-boot-guard.test.sh
          bash scripts/setup/uninstall.test.sh
          bash scripts/setup/linux-web-port.test.sh </dev/null
          bash scripts/backups/backup-retention.test.sh </dev/null
          bash scripts/airgap/build-artifacts.test.sh </dev/null
          echo "인스톨러 lint 통과 (bash -n + shellcheck + omk.test)"

      # ─── Gate 0.7: Dependency Audit ───
      # 운영 의존성(--omit=dev)의 high 이상 npm 권고가 새로 생기면 막는다(F28.8). 기존 부채는
      # .audit-allowlist.json 에 사유·만료일과 함께 — 만료가 지나면 다시 실패한다. 수 초짜리라 Jest 앞에 둔다.
      - name: "Gate 0.7: Dependency Audit"
        run: npm run audit:gate

      # ─── Gate 1: Jest ───
      # 로컬 `npm test` 와 **같은 러너**로 돈다. 이전에는 bun test 로 돌렸는데, 로컬은 jest 라
      # 러너가 갈라져 있었다 — bun 은 jest.resetModules 등 일부 API 를 지원하지 않아 실측 시
      # 12개가 러너 차이만으로 실패했다. 게다가 대상이 src/__tests__ **직속**(비재귀)이라
      # 서브디렉토리·인라인 테스트 86개는 애초에 게이트 밖이었다. jest 로 통일해 전량을 본다.
      #
      # DB 가 필요한 테스트(*.db.test.ts)는 여기서는 TEST_DATABASE_URL 이 없어 스스로 describe.skip 하고, Gate 1.5 가 따로 돌린다.
      - name: "Gate 1: Jest"
        run: npm test
        env:
          # supertest 반복 호출이 rate limit 에 걸리지 않도록 — jest.setup.ts 와 같은 축
          CI: 'true'

      # ─── Gate 1.5: DB Tests ───
      # 위 PostgreSQL 서비스에 코어+add-on 마이그레이션을 적용하고(scripts/setup-test-db.sh, psql·.env 불필요)
      # *.db.test.ts 만 --runInBand 로 돌린다(scripts/ci/run-db-tests.mjs). "db tests ran: N" 이 0 이면(전부 skip —
      # 변수가 jest 에 닿지 않음) 실패로 본다. Gate 1 에는 변수를 주지 않는다 — 주면 jest.setup-after-env 의 pg 차단이 풀려
      # 단위 테스트까지 실 DB 에 붙는다.
      - name: "Gate 1.5: DB Tests (PostgreSQL)"
        env:
          TEST_DATABASE_URL: postgresql://openmake:openmake_test@localhost:5433/openmake_llm_test
          CI: 'true'
        run: |
          bash scripts/setup-test-db.sh
          npm run test:db

      # ─── Gate 2: TypeScript Build ───
      # 웹 빌드는 next/font/google 로 Google 에서 폰트를 받는다 — 그 다운로드가 한 번 실패하면 코드와 무관하게
      # 빌드 전체가 깨진다(2026-10-03 #1069 실측: 재실행으로 통과). 일시 실패만 한 번 다시 시도한다.
      - name: "Gate 2: TypeScript Build"
        run: npm run build || { echo "::warning::빌드 실패 — 30초 뒤 한 번 재시도합니다"; sleep 30; npm run build; }

      # PR 에서 미리 본다: 바뀐 소스마다 관련 Jest 테스트가 있는지(선정만, 실행 없음).
      # dev 푸시의 "Merged dev" 단계가 같은 기준(origin/main 과의 merge-base)으로 보므로, PR 의 머지 커밋(HEAD)으로 재면 머지 뒤 결과를 미리 안다.
      # pull_request 체크아웃 HEAD 는 refs/pull/N/merge 머지 커밋이라 github.sha 가 아니라 git rev-parse HEAD 를 쓴다.
      - name: "PR: changed-feature selection (related Jest tests must exist)"
        if: github.event_name == 'pull_request'
        run: node scripts/ci/feature-checks.mjs --select-only "$(git rev-parse HEAD)"

      # Only actual merged-dev push SHA; no entire Playwright suite.
      - name: "Merged dev: isolated basic app and changed-feature checks"
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          TEST_DATABASE_URL: postgresql://openmake:openmake_test@localhost:5433/openmake_llm_test
          TESTED_SHA: ${{ github.sha }}
        run: npm run test:dev -- "$TESTED_SHA"

      - name: Upload merged-dev check evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: dev-checks-${{ github.sha }}
          path: logs/dev-checks.json
          if-no-files-found: error
          retention-days: 30

      # ─── Gate 3: File Size Guard (max 600 lines) ───
      - name: "Gate 3: File Size Guard"
        run: |
          MAX_LINES=600
          VIOLATIONS=""
          while IFS= read -r f; do
            lines=$(grep -c '' "$f" 2>/dev/null || echo 0)
            if [ "$lines" -gt "$MAX_LINES" ]; then
              VIOLATIONS="$VIOLATIONS\n  $f ($lines lines)"
            fi
          done < <(find apps/api/src -name '*.ts' -not -path '*/dist/*' -not -path '*__tests__*' -not -name '*.test.*' -not -name '*.d.ts' -not -name '*-locales.ts' -not -name '*-data-*.ts' -not -name '*-guidelines.ts' -not -name 'types.ts' -not -name 'runtime-limits.ts' -not -name 'prompt-templates.ts' -not -name 'language-policy.ts')
          if [ -n "$VIOLATIONS" ]; then
            echo "Files exceeding $MAX_LINES lines:$VIOLATIONS"
            exit 1
          fi
          echo "All source files within $MAX_LINES line limit"

      # ─── Gate 4: ESLint ───
      - name: "Gate 4: ESLint"
        run: npm run lint

      # add-on → Base 내부 import ratchet(설계 D2) — 허용 목록(scripts/lint/addon-import-allowlist.json) 밖의 새 import 만 실패.
      # 목록에서 사라진 항목은 권고만 출력한다(npm run gen:addon-boundary 로 목록을 줄인다). 계약 패키지 경계는 위 ESLint 가 본다.
      - name: "Gate 4: Add-on Boundary (ratchet)"
        run: npm run check:addon-boundary

      # 루트 eslint 설정은 apps/web/** 를 제외한다 — web 은 자체 설정(eslint-config-next)으로 따로 돈다.
      - name: "Gate 4: ESLint (apps/web)"
        run: npm run lint --workspace=apps/web

      # 번역 키 일치 + 문구 형식(ICU 파싱, 따옴표로 감싼 변수) — 화면에서 터지기 전에 잡는다.
      - name: "Gate 4: i18n (apps/web)"
        run: npm run check:i18n --workspace=apps/web

      # ─── Gate 5: Routing Evaluation ───
      # 키워드 라우터 정확도 회귀 검출. 베이스라인 50% 임계값 미만 시 차단.
      # eval:augmented는 Ollama embedding 호출 필요로 CI에서 제외 (수동/스테이징 실행)
      - name: "Gate 5: Routing Evaluation (Golden Dataset)"
        working-directory: apps/api
        env:
          OMK_EVAL_PASS_THRESHOLD: '0.5'
        run: npm run eval:routing

      # ─── Gate 6: Response Pattern Evaluation (mock) ───
      # 응답 패턴 평가기 자체 동작 + mock generator 룰셋 회귀 검출.
      # --real 모드는 LLM 비용 발생으로 별도 워크플로우(미구현)
      - name: "Gate 6: Response Pattern Evaluation (mock)"
        working-directory: apps/api
        env:
          OMK_EVAL_RESPONSE_THRESHOLD: '0.5'
        run: npm run eval:response

      # ─── Gate 7: Prompt·Tool Schema Budget ───
      # CI 는 LLM 에 닿지 못해 지연을 못 잰다 — 첫 토큰 지연의 주요인인 시스템 프롬프트 정적 prefix·전체 길이와
      # 상시 노출 도구 스키마 크기를 기준선(evaluation/baselines/budget-baseline.json) 대비 증가율로 막는다(F26.8).
      # 정당한 증가는 `npm run eval:budget -- --update-baseline` 결과를 같은 PR 에 포함한다.
      - name: "Gate 7: Prompt & Tool Schema Budget"
        working-directory: apps/api
        env:
          OMK_EVAL_BUDGET_DRIFT_PCT: '10'
        run: npm run eval:budget

      # ─── Gate 8: Tool Selection (mock) ───
      # 운영과 같은 결정적 판정(selectTurnTools → buildExternalToolPlan)으로 골든셋 40건의 "이 턴 노출 도구"를 검사한다(F26.2).
      # 의도 게이트·역할 게이트 변경으로 기대 도구가 빠지거나 금지 도구가 새면 실패. 실모델 호출 판정(--real)은 nightly.
      - name: "Gate 8: Tool Selection (mock)"
        working-directory: apps/api
        env:
          OMK_EVAL_TOOL_THRESHOLD: '0.97'
        run: npm run eval:tools

      # ─── Gate 9: Runtime Red Team (mock) ───
      # 게이트 함수를 직접 친다(F26.6): 실행 역할 게이트·관리자 도구 노출·SSRF(가짜 DNS)·작업공간 경로 탈출·로그 마스킹.
      # 전부 통과해야 한다(임계 1.0). 실모델 응답 판정(프롬프트·비밀값 유출, 간접 인젝션)은 nightly --real.
      - name: "Gate 9: Runtime Red Team (mock)"
        working-directory: apps/api
        run: npm run eval:redteam

      # ─── Gate 10: Trajectory Process Checks (mock) ───
      # 궤적 과정 검사기 자체를 검증한다: 알려진 정상·불량 궤적(golden-trajectory.json)에서 기대한 판정이 나오는지.
      # 검사기 규칙이 느슨해지거나 엉뚱한 검사가 실패하는 회귀를 잡는다. LLM·DB 를 쓰지 않는다.
      - name: "Gate 10: Trajectory Process Checks (mock)"
        working-directory: apps/api
        run: npm run eval:trajectory

      # ─── Gate 11: Compaction Recall (mock) ───
      # 긴 대화 각본을 접기·인계 요약에 통과시켜, 사라지는 구간의 "무엇을 했고 결과가 어땠나"가 남는지 채점한다.
      # 접힌 결과의 한 줄 요약이나 인계 요약이 정보를 잃는 회귀를 잡는다. LLM·DB 를 쓰지 않는다.
      - name: "Gate 11: Compaction Recall (mock)"
        working-directory: apps/api
        run: npm run eval:compaction

      # ─── Gate 12: Memory Ranking Recall (mock) ───
      # 가상 메모리 묶음(golden-memory-rank.json)에서 토큰 상한 안에 실려야 할 메모리가 실리는 비율을 최신순과 비교한다.
      # 순위 방식이 기본 켜짐이므로, 규칙을 바꿔 최신순보다 나빠지면 걸린다. LLM·DB 를 쓰지 않는다.
      - name: "Gate 12: Memory Ranking Recall (mock)"
        working-directory: apps/api
        run: npm run eval:memory-rank

      # 평가 결과 아티팩트 업로드 (PR 회귀 추적용)
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-results-${{ github.sha }}
          path: apps/api/logs/*-evaluation-*.json
          if-no-files-found: ignore
          retention-days: 30

  # macOS 호스트 정리(mac-host-repair.sh)는 plist(plutil)·실제 zsh 로그인 셸 검증이 macOS 전용이라
  # Ubuntu 의 Gate 0.5 에서는 SKIP 된다. 같은 가짜 Homebrew·launchctl 시험을 macOS 러너에서 돌린다 (npm 설치 없음).
  mac-host-repair:
    name: macOS host repair fixtures
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Host repair fixtures (system bash 3.2)
        run: |
          node --test scripts/ci/docker-config-reconcile.test.mjs
          /bin/bash scripts/setup/mac-toolchain.test.sh
          /bin/bash scripts/setup/mac-host-repair.test.sh
          /bin/bash scripts/setup/mac-pm2-boot.test.sh
          /bin/bash scripts/setup/colima-boot-guard.test.sh
      # 운영 Mac 은 Homebrew bash 5(patsub_replacement 기본 켜짐)로 설치기를 돌릴 수 있다 — 같은 시험을 그 셸로도 돌린다.
      # (이 러너는 일회용 CI 기계다. 실제 호스트의 소프트웨어는 바꾸지 않는다.)
      - name: Host repair fixtures (Homebrew bash 5)
        run: |
          brew list --formula bash >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          B5="$(brew --prefix)/bin/bash"
          "$B5" -c 'shopt -q patsub_replacement' || { echo "patsub_replacement is not on in $("$B5" --version | head -1)"; exit 1; }
          # Homebrew bin 에 다른 버전 node 가 있을 수 있다 — setup-node 가 맞춘 node 를 bash 5 디렉터리보다 앞에 둔다.
          NODE_DIR="$(dirname "$(command -v node)")"
          PATH="$NODE_DIR:$(dirname "$B5"):$PATH" "$B5" scripts/setup/mac-toolchain.test.sh
          PATH="$NODE_DIR:$(dirname "$B5"):$PATH" "$B5" scripts/setup/mac-host-repair.test.sh
          PATH="$NODE_DIR:$(dirname "$B5"):$PATH" BASH5="$B5" "$B5" scripts/setup/mac-pm2-boot.test.sh
