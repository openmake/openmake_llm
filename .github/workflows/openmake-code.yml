# ==============================================================
# openmake_code Rust 코어 CI (설계 2026-11-12 §2.5)
# ==============================================================
# path-filter: Rust workspace(apps/openmake-code) 또는 공용 적합성 fixture·REST 계약(openapi.v1.json — omk-api 계약 대조) 변경 시에만 실행.
# 코어의 검증 대상(sandbox-exec·/private/tmp realpath 등)이 macOS 고유라 macOS 러너에서 돈다.
# TS 러너(conformance.test.ts)는 ci.yml Gate 1(bridge 선정)이 맡고, 여기서는 Rust 쪽만 본다.
# 툴체인은 apps/openmake-code/rust-toolchain.toml 로 고정한다(러너 이미지의 rustup 이 그 판을 받는다).
# 헬퍼 하네스(apps/desktop-native/helper/harness.cjs)는 debug omk-helper 를 여기서, 앱에 넣는 release 빌드와 Node 헬퍼(2.2 까지)는 desktop-native.yml 이 돈다.
# ==============================================================

name: openmake-code

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/openmake-code/**'
      - 'packages/local-bridge-core/conformance/**'
      - 'packages/api-contracts/openapi.v1.json'
      - 'infra/task-runtime/__fixtures__/browser-flow-cases.json'
      - 'apps/desktop-native/helper/harness.cjs'
      - '.github/workflows/openmake-code.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/openmake-code/**'
      - 'packages/local-bridge-core/conformance/**'
      - 'packages/api-contracts/openapi.v1.json'
      - 'infra/task-runtime/__fixtures__/browser-flow-cases.json'
      - 'apps/desktop-native/helper/harness.cjs'
      - '.github/workflows/openmake-code.yml'

permissions:
  contents: read

concurrency:
  group: openmake-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core (fmt → clippy → test → helper harness → deny)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/openmake-code
    env:
      CARGO_TERM_COLOR: never
      # cargo-deny 는 버전을 고정해 자체 Cargo.lock 으로 빌드한다(--locked).
      CARGO_DENY_VERSION: 0.20.2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml 의 판·구성 요소(rustfmt·clippy)를 받는다.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (conformance + unit)
        run: cargo test --locked

      # regress 저장소 안 사본(워크스페이스 밖) — 상류 테스트 + 우리 패치 테스트(vendor/regress/OMK-PATCHES.md).
      - name: Test (vendored regress)
        run: cargo test --locked --manifest-path vendor/regress/Cargo.toml --features utf16

      # omk-helper 를 Node 헬퍼와 같은 stdio 하네스로(PR-1.7 D-102). 하네스는 ws 패키지만 쓴다 — build:packages·esbuild 불필요.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # npm 은 .npm-version 판으로 — 서버(omk env update)·설치기와 같은 판을 쓴다(node 에 딸린 판은 node 판마다 다르다).
      - name: npm (.npm-version)
        shell: bash
        run: npm install -g --no-audit --no-fund "npm@$(tr -d '[:space:]' < .npm-version)" && npm -v

      - name: Helper harness (omk-helper)
        working-directory: .
        run: |
          npm ci --ignore-scripts
          (cd apps/openmake-code && cargo build --locked -p omk-helper)
          node apps/desktop-native/helper/harness.cjs --helper apps/openmake-code/target/debug/omk-helper

      - name: Dependency advisories and licenses
        run: |
          cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
          cargo deny check advisories licenses
