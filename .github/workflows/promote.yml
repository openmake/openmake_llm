# Privileged orchestration executes only trusted default-branch code.
name: promote
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pipeline-promote
  cancel-in-progress: false
jobs:
  orchestrate:
    if: (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') && github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Verify credentials and run trusted orchestration
        env:
          OMK_AUTOMATION_TOKEN: ${{ secrets.OMK_AUTOMATION_TOKEN }}
          OMK_PROMOTE_TOKEN: ${{ secrets.OMK_PROMOTE_TOKEN }}
        run: node scripts/pipeline/github.mjs promote
