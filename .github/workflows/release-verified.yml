# Privileged orchestration executes only trusted default-branch code.
name: release-verified
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-release-verified
  cancel-in-progress: false
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Verify credentials and run trusted orchestration
        env:
          OMK_AUTOMATION_TOKEN: ${{ secrets.OMK_AUTOMATION_TOKEN }}
          OMK_PROMOTE_TOKEN: ${{ secrets.OMK_PROMOTE_TOKEN }}
        run: node scripts/pipeline/github.mjs release
