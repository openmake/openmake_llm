# ============================================================
# Release Please — Conventional Commits 기반 자동 버저닝
# ============================================================
# main 에 커밋이 쌓이면 release-please 가 "Release PR" 을 자동으로 만든다.
#   fix:            → patch (1.5.6 → 1.5.7)
#   feat:           → minor (1.5.6 → 1.6.0)
#   feat!: / BREAKING CHANGE: → major (1.5.6 → 2.0.0)
#
# 그 Release PR 을 머지하면 → 태그(vX.Y.Z) + GitHub Release + CHANGELOG 반영.
# 사람이 버전 숫자를 손으로 고치는 일은 없다. 커밋 메시지가 버전을 정한다.
#
# 버전 SoT = 루트 package.json (constants.ts APP_VERSION 이 이 값을 읽는다).
# workspace package.json 들은 release-please-config.json 의 extra-files 로 함께 동기화된다.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ─── 공급망: SBOM + 빌드 증명 (F28.8) ───
  # 릴리스가 만들어진 실행에서만 돈다. 태그 소스 아카이브와 CycloneDX SBOM 을 만들어 Sigstore 기반 GitHub 증명
  # (빌드 출처 provenance + SBOM)을 붙이고 릴리스 자산으로 올린다. SBOM 은 package-lock 만 읽어(--package-lock-only)
  # npm ci 없이 만든다 — 설치 스크립트를 실행하지 않는다.
  # 검증: scripts/verify-release.sh vX.Y.Z  (= gh attestation verify <자산> --repo openmake/openmake_llm)
  sbom-attest:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 릴리스 자산 업로드
      id-token: write        # Sigstore OIDC 서명
      attestations: write    # GitHub 증명 저장
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Source archive
        run: git archive --format=tar.gz --prefix="openmake_llm-${TAG}/" -o "openmake_llm-${TAG}.tar.gz" "${TAG}"

      - name: CycloneDX SBOM (package-lock)
        # --ignore-npm-errors: 루트 overrides(보안 패치로 강제한 adm-zip ^0.6.1)를 `npm ls` 가 "invalid" 로 보고해 exit 254 가 난다
        # (onnxruntime-node 가 ^0.5.16 을 요구). 의도한 override 라 오류가 아니다 — SBOM 에는 실제 해석된 버전(0.6.1)이 실린다.
        # v1.78.0·v1.79.0 릴리스가 이 단계에서 실패해 SBOM·증명이 빠졌다(2026-09-20).
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --omit dev --ignore-npm-errors --output-file "sbom-${TAG}.cdx.json"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: openmake_llm-${{ env.TAG }}.tar.gz

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: openmake_llm-${{ env.TAG }}.tar.gz
          sbom-path: sbom-${{ env.TAG }}.cdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" "openmake_llm-${TAG}.tar.gz" "sbom-${TAG}.cdx.json" --clobber
