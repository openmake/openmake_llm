# ============================================================
# 도구 고정 판 올리기 — Dependabot 이 읽지 못하는 고정값을 매주 최신으로 올리는 PR
# ============================================================
# 대상: Node(.node-version·mise.toml·runtime Dockerfile, 지금 메이저 안에서만), pm2(.pm2-version),
#       LiteLLM(omk.sh OMK_LITELLM_VERSION), caddy(omk.sh CADDY_PINNED_VERSION). 구성요소마다 PR 하나.
# 설치 시점의 최신을 받지 않고 고정해 두는 이유: CI → staging 검증 → 승인 → 운영이 같은 조합을 돌려야 한다.
# PR 은 dev 로 올리고 브랜치는 chore/ — CI 가 통과하면 auto-merge 흐름을 그대로 탄다. 커밋은 fix(deps) — 서버 도구 판이
# 바뀌므로 release-please 가 패치 릴리스를 연다(chore 는 릴리스를 만들지 않는다). 서버는 omk env update 가 맞춘다.
# PR 이 CI 를 일으키려면 GITHUB_TOKEN 이 아닌 자격(OMK_AUTOMATION_TOKEN, 이전 OMK_PROMOTE_TOKEN)이 필요하다.
name: toolchain-bump

on:
  schedule:
    - cron: '0 0 * * 1'   # 월요일 09:00 KST (Dependabot 과 같은 날)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        component: [node, pm2, litellm, caddy]
    steps:
      - name: Require downstream-triggering automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.OMK_AUTOMATION_TOKEN || secrets.OMK_PROMOTE_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::Set OMK_AUTOMATION_TOKEN (GitHub App or PAT); bump PRs need a separate credential to trigger CI."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          token: ${{ secrets.OMK_AUTOMATION_TOKEN || secrets.OMK_PROMOTE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Bump ${{ matrix.component }}
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: |
          out="$(node scripts/ci/toolchain-bump.mjs --write "$COMPONENT")"
          echo "$out"
          node -e 'const [p]=JSON.parse(process.argv[1]);const o=require("fs").createWriteStream(process.env.GITHUB_OUTPUT,{flags:"a"});o.write(`bump=${p.bump}\ncurrent=${p.current}\nlatest=${p.latest}\n`);o.end()' "$out"
      - name: Open PR
        if: steps.bump.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMK_AUTOMATION_TOKEN || secrets.OMK_PROMOTE_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          CURRENT: ${{ steps.bump.outputs.current }}
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          branch="chore/toolchain-bump-$COMPONENT-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists — PR is open or was handled"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -qam "fix(deps): $COMPONENT $CURRENT → $LATEST"
          git push -q origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "fix(deps): $COMPONENT $CURRENT → $LATEST" \
            --body "scripts/ci/toolchain-bump.mjs 가 연 정기 갱신 PR (.github/workflows/toolchain-bump.yml).

          - $COMPONENT: \`$CURRENT\` → \`$LATEST\`
          - CI 통과 후 dev → staging 검증 → 승인 → 운영 순서로 올라간다. 서버는 \`omk env update\` 가 고정값에 맞춘다(Node·pm2 는 PM2 데몬 교체 포함, LiteLLM 은 새 venv, caddy 는 omk 가 받은 바이너리)."
